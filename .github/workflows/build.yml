name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Baixar Gradle 2.14 (compativel com Forge 1.8.9)
        run: |
          wget https://services.gradle.org/distributions/gradle-2.14-bin.zip
          unzip -q gradle-2.14-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-2.14/bin" >> $GITHUB_PATH

      - name: Build do mod
        run: gradle build --no-daemon

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: jumpreset-jar
          path: build/libs/*.jar
